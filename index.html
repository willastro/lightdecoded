<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Name — Spectral & Imaging Data Scientist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: black;
    overflow: hidden;
    font-family: "Inter", sans-serif;
    color: white;
  }

  /* ---------- SPLASH SCREEN ---------- */
  .splash {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #000 0%, #050505 100%);
    animation: fadeOut 2s ease 6s forwards;
  }

  svg {
    width: 60vmin;
    height: auto;
    overflow: visible;
  }

  /* Light beam */
  .beam {
    stroke: white;
    stroke-width: 6;
    stroke-linecap: round;
    opacity: 0;
    animation: beamIn 1.5s ease forwards;
  }

  /* Prism */
  .prism {
    fill: none;
    stroke: #88ffff;
    stroke-width: 3;
    opacity: 0;
    animation: prismFade 1s ease 1.5s forwards;
  }

  /* Spectrum rays */
  .ray {
    stroke-width: 4;
    stroke-linecap: round;
    opacity: 0;
    animation: spectrumOut 2s ease 2.5s forwards;
  }
  .ray:nth-child(3) { stroke: #ff0000; }
  .ray:nth-child(4) { stroke: #ff7f00; }
  .ray:nth-child(5) { stroke: #ffff00; }
  .ray:nth-child(6) { stroke: #00ff00; }
  .ray:nth-child(7) { stroke: #0000ff; }
  .ray:nth-child(8) { stroke: #4b0082; }
  .ray:nth-child(9) { stroke: #9400d3; }

  /* Title text */
  .splash h1 {
    position: absolute;
    bottom: 10%;
    width: 100%;
    text-align: center;
    font-size: 1.5rem;
    opacity: 0;
    animation: textFade 2s ease 4.5s forwards;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes beamIn {
    from { opacity: 0; stroke-dasharray: 200; stroke-dashoffset: 200; }
    to { opacity: 1; stroke-dashoffset: 0; }
  }

  @keyframes prismFade {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes spectrumOut {
    0% { opacity: 0; transform: scaleX(0.3); transform-origin: left; }
    100% { opacity: 1; transform: scaleX(1); transform-origin: left; }
  }

  @keyframes textFade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
  }
</style>
</head>
<body>
  <div class="splash">
    <svg viewBox="0 0 400 200">
      <!-- Incoming beam -->
      <line class="beam" x1="0" y1="100" x2="160" y2="100" />

      <!-- Prism -->
      <polygon class="prism" points="160,60 200,100 160,140" />

      <!-- Spectrum rays -->
      <line class="ray" x1="200" y1="100" x2="380" y2="80" />
      <line class="ray" x1="200" y1="100" x2="380" y2="85" />
      <line class="ray" x1="200" y1="100" x2="380" y2="90" />
      <line class="ray" x1="200" y1="100" x2="380" y2="95" />
      <line class="ray" x1="200" y1="100" x2="380" y2="100" />
      <line class="ray" x1="200" y1="100" x2="380" y2="105" />
      <line class="ray" x1="200" y1="100" x2="380" y2="110" />
    </svg>

    <h1>Your Name — Spectral & Imaging Data Scientist</h1>
  </div>

  <script>
    // After animation ends (~8s total), redirect to index.md
    setTimeout(() => {
      document.body.style.transition = "opacity 2s ease";
      document.body.style.opacity = "0";
      setTimeout(() => {
        window.location.href = "index.md";
      }, 2000); // Wait for fade to finish
    }, 8000);
  </script>
</body>
</html>
