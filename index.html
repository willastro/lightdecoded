<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Name — Spectral & Imaging Data Scientist</title>
  <style>
    body {
      background: radial-gradient(circle at 30% 50%, #0a0a0a, #000);
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      font-family: "Inter", sans-serif;
    }
    svg {
      width: 85vw;
      height: 55vh;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    }
    .beam {
      stroke: white;
      stroke-width: 6;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      filter: drop-shadow(0 0 15px white);
      animation: draw-beam 2s ease-out forwards;
    }
    @keyframes draw-beam {
      to { stroke-dashoffset: 0; }
    }
    .spectrum {
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
      animation: show-spectrum 2s ease-out 2s forwards;
    }
    @keyframes show-spectrum {
      to { opacity: 1; }
    }
    .text {
      opacity: 0;
      animation: fade-text 2s ease-out 4s forwards;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    @keyframes fade-text {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 800 400">
    <!-- White beam -->
    <line x1="0" y1="200" x2="400" y2="200" class="beam" />

    <!-- Prism -->
    <polygon points="400,150 460,200 400,250"
             fill="url(#glass)" stroke="white" stroke-width="1" opacity="0.8"/>

    <defs>
      <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#555" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#aaa" stop-opacity="0.1"/>
      </linearGradient>
    </defs>

    <!-- Spectrum rays -->
    <g class="spectrum">
      <line x1="460" y1="200" x2="800" y2="170" stroke="red" stroke-width="4"/>
      <line x1="460" y1="200" x2="800" y2="180" stroke="orange" stroke-width="4"/>
      <line x1="460" y1="200" x2="800" y2="190" stroke="yellow" stroke-width="4"/>
      <line x1="460" y1="200" x2="800" y2="200" stroke="green" stroke-width="4"/>
      <line x1="460" y1="200" x2="800" y2="210" stroke="blue" stroke-width="4"/>
      <line x1="460" y1="200" x2="800" y2="220" stroke="indigo" stroke-width="4"/>
      <line x1="460" y1="200" x2="800" y2="230" stroke="violet" stroke-width="4"/>
    </g>
  </svg>

  <div class="text">Your Name — Spectral & Imaging Data Scientist</div>
  <script>
  // After animation ends (~8s total), fade and go to your main page
  setTimeout(() => {
    document.body.style.transition = "opacity 2s ease";
    document.body.style.opacity = "0";
    setTimeout(() => {
      window.location.href = "./"; // redirects to your main page (index.md)
    }, 2000); // wait for fade
  }, 8000);
</script>
  
</body>
</html>
