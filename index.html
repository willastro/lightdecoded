<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Name — Spectral & Imaging Data Scientist</title>
  <style>
    html,body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    #fade-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="fade-overlay"></div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r161/three.min.js" crossorigin="anonymous"></script>
  <script>
    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
    camera.position.z = 8;

    // Prism
    const prismGeom = new THREE.ConeGeometry(1, 2, 3);
    const prismMat = new THREE.MeshPhysicalMaterial({
      color: 0x88ffff,
      transmission: 0.8,
      opacity: 0.9,
      transparent: true,
      roughness: 0.2,
      metalness: 0.1,
      clearcoat: 1.0,
      reflectivity: 1.0,
    });
    const prism = new THREE.Mesh(prismGeom, prismMat);
    prism.rotation.z = Math.PI / 2;
    prism.rotation.y = Math.PI / 2;
    scene.add(prism);

    // White beam
    const beamMat = new THREE.LineBasicMaterial({color:0xffffff});
    const beamGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-6,0,0),
      new THREE.Vector3(-1,0,0)
    ]);
    const beam = new THREE.Line(beamGeom, beamMat);
    scene.add(beam);

    // Spectrum rays
    const colors=[0xff0000,0xff7f00,0xffff00,0x00ff00,0x0000ff,0x4b0082,0x9400d3];
    const spectra = colors.map((c,i)=>{
      const m=new THREE.LineBasicMaterial({color:c,transparent:true,opacity:0});
      const g=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(1,0,0),
        new THREE.Vector3(6,(i-3)*0.3,0)
      ]);
      const line=new THREE.Line(g,m);
      scene.add(line);
      return line;
    });

    const light = new THREE.PointLight(0xffffff,2);
    light.position.set(-4,2,3);
    scene.add(light);

    let t=0;
    function animate(){
      requestAnimationFrame(animate);
      t+=0.01;
      prism.rotation.y+=0.005;
      // Fade in spectrum
      if(t>2 && t<4){
        const p=Math.min((t-2)/1.5,1);
        spectra.forEach(l=>l.material.opacity=p);
      }
      renderer.render(scene,camera);
      if(t>6) triggerFade();
    }
    animate();

    function triggerFade(){
      const overlay=document.getElementById("fade-overlay");
      overlay.style.opacity="1";
      setTimeout(()=>window.location.href="home.html",2000); // 2s fade, then redirect
    }

    window.addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
