<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spectral & Imaging Data Scientist — Splash</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #fade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      opacity: 0;
      transition: opacity 2s ease;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="fade-overlay"></div>

  <script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
  <script>
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 8;

    // Prism
    const prismGeometry = new THREE.ConeGeometry(1, 2, 3);
    const prismMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x88ffff,
      transmission: 0.8,
      opacity: 0.9,
      transparent: true,
      roughness: 0.2,
      metalness: 0.1,
      clearcoat: 1.0,
      reflectivity: 1.0
    });
    const prism = new THREE.Mesh(prismGeometry, prismMaterial);
    prism.rotation.z = Math.PI / 2;
    prism.rotation.y = Math.PI / 2;
    scene.add(prism);

    // White beam
    const beamMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
    const beamGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-6, 0, 0),
      new THREE.Vector3(-1, 0, 0)
    ]);
    const beam = new THREE.Line(beamGeometry, beamMaterial);
    scene.add(beam);

    // Spectrum rays
    const colors = [0xff0000, 0xff7f00, 0xffff00, 0x00ff00, 0x0000ff, 0x4b0082, 0x9400d3];
    const spectra = colors.map((c, i) => {
      const material = new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0 });
      const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(1, 0, 0),
        new THREE.Vector3(6, (i - 3) * 0.3, 0)
      ]);
      const line = new THREE.Line(geometry, material);
      scene.add(line);
      return line;
    });

    const light = new THREE.PointLight(0xffffff, 2);
    light.position.set(-4, 2, 3);
    scene.add(light);

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.01;
      prism.rotation.y += 0.005;

      if (t > 2 && t < 4) {
        const p = Math.min((t - 2) / 1.5, 1);
        spectra.forEach(line => line.material.opacity = p);
      }

      renderer.render(scene, camera);

      if (t > 6) triggerFade();
    }

    function triggerFade() {
      const overlay = document.getElementById("fade-overlay");
      overlay.style.opacity = "1";
      setTimeout(() => window.location.href = "home.html", 2000);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
