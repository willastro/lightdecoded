<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spectral & Imaging Data Scientist — Splash</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
    }
    h1 {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-family: sans-serif;
      color: white;
      font-size: 1.8rem;
      opacity: 0;
      animation: fadeIn 2s ease 5s forwards;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <h1>Your Name — Spectral & Imaging Data Scientist</h1>

  <script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
  <script>
    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000);

    const scene = new THREE.Scene();

    // Add subtle ambient light
    const ambient = new THREE.AmbientLight(0x404040, 2);
    scene.add(ambient);

    const light = new THREE.PointLight(0xffffff, 3);
    light.position.set(-4, 3, 5);
    scene.add(light);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 8;
    camera.position.y = 0;
    camera.lookAt(0, 0, 0);

    // Prism geometry
    const prismGeometry = new THREE.ConeGeometry(1.5, 2.5, 3);
    const prismMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x99ffff,
      transmission: 0.8,
      opacity: 0.8,
      transparent: true,
      roughness: 0.2,
      metalness: 0.1,
      clearcoat: 1.0,
      reflectivity: 1.0,
      side: THREE.DoubleSide
    });
    const prism = new THREE.Mesh(prismGeometry, prismMaterial);
    prism.rotation.z = Math.PI / 2;
    prism.rotation.y = Math.PI / 2.5;
    prism.position.x = 0;
    scene.add(prism);

    // Incoming beam (white)
    const beamMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
    const beamGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-8, 0, 0),
      new THREE.Vector3(-1.2, 0, 0)
    ]);
    const beam = new THREE.Line(beamGeometry, beamMaterial);
    scene.add(beam);

    // Spectrum rays
    const colors = [0xff0000, 0xff7f00, 0xffff00, 0x00ff00, 0x0000ff, 0x4b0082, 0x9400d3];
    const spectra = colors.map((color, i) => {
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0 });
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(1.2, 0, 0),
        new THREE.Vector3(8, (i - 3) * 0.5, 0)
      ]);
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      return line;
    });

    // Animation timing
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.01;

      // Rotate prism slightly
      prism.rotation.y += 0.005;

      // Fade in spectrum rays after 2 seconds
      if (t > 2 && t < 5) {
        const progress = Math.min((t - 2) / 2.5, 1);
        spectra.forEach(line => line.material.opacity = progress);
      }

      renderer.render(scene, camera);
    }

    animate();

    // Responsive resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
